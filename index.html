<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCSE Readiness Tracker</title>
<style>
body{font-family:Arial;background:#f6f5ff;padding:15px;max-width:800px;margin:auto}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.circle{width:130px;height:130px;border-radius:50%;background:conic-gradient(#6c5ce7 55%,#e9e7ff 0);display:grid;place-items:center;margin:auto}
.circle span{background:white;width:95px;height:95px;border-radius:50%;display:grid;place-items:center;font-weight:bold;font-size:26px}
button{background:#6c5ce7;color:white;border:0;padding:11px 16px;border-radius:10px;cursor:pointer;width:100%;margin-top:8px}
input,select{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-top:6px}
</style></head><body>
<div class="card"><h2>📊 KCSE Readiness Tracker</h2>
<div class="circle" id="circle"><span id="scoreText">55%</span></div>
<p style="text-align:center" id="statusText">Ready</p></div>

<div class="card"><h3>Add Mock Score</h3>
<select id="subject"><option>Mathematics</option><option>English</option><option>Chemistry</option><option>Biology</option><option>Physics</option></select>
<input type="number" id="scoreInput" placeholder="e.g. 62">
<button onclick="addScore()">Add Score</button>
<div id="scoreList" style="margin-top:10px"></div></div>

<div class="card"><h3>Syllabus Checklist</h3>
<div id="topicList"></div>
<button onclick="clearData()" style="background:#ff6b6b">Reset Data</button></div>

<script>
let topics=JSON.parse(localStorage.getItem('rt_topics'))||[
{name:"Math - Algebra",done:true},{name:"Math - Trigonometry",done:false},
{name:"English Grammar",done:true},{name:"Chemistry - Mole",done:false},{name:"Biology - Genetics",done:true}];
let scores=JSON.parse(localStorage.getItem('rt_scores'))||[{subject:"Mathematics",score:62},{subject:"Chemistry",score:55}];
function save(){localStorage.setItem('rt_topics',JSON.stringify(topics));localStorage.setItem('rt_scores',JSON.stringify(scores));render();}
function render(){
let tList=document.getElementById('topicList');tList.innerHTML="";
topics.forEach((t,i)=>{tList.innerHTML+=`<label style="display:block;margin:6px 0"><input type="checkbox" ${t.done?'checked':''} onchange="topics[${i}].done=!topics[${i}].done;save()"> ${t.name}</label>`;});
let sList=document.getElementById('scoreList');sList.innerHTML=scores.map(s=>`• ${s.subject}: ${s.score}%`).join('<br>');
let coverage=Math.round(topics.filter(t=>t.done).length/topics.length*100);
let avg=scores.length?Math.round(scores.reduce((a,b)=>a+b.score,0)/scores.length):0;
let overall=Math.round(coverage*0.5+avg*0.5);
document.getElementById('scoreText').innerText=overall+"%";
document.getElementById('statusText').innerText=coverage+"% syllabus | "+avg+"% avg score | "+overall+"% Ready";
document.getElementById('circle').style.background=`conic-gradient(#6c5ce7 ${overall}%,#e9e7ff 0)`;
}
function addScore(){let subj=document.getElementById('subject').value;let sc=parseInt(document.getElementById('scoreInput').value);if(!sc){alert("Enter score");return;}scores.push({subject:subj,score:sc});document.getElementById('scoreInput').value="";save();}
function clearData(){localStorage.clear();location.reload();}
render();
</script></body></html>
